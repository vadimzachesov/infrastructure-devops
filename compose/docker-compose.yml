services:
  nginx:
    image: nginx:alpine
    container_name: compose-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # <ИСТОЧНИК_НА_ХОСТЕ>:<ПУТЬ_В_КОНТЕЙНЕРЕ>:<ОПЦИИ_ДОСТУПА>
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-net

  app:
    image: nginx:alpine
    container_name: compose-app-backend
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
