---
- name: Check if port 80 is available
  wait_for:
    port: 80
    state: stopped
    timeout: 2
    msg: "Освободите порт 80 перед использованием!"

- name: Ensure deployer group exists
  group:
    name: "{{ deployer_user }}"
    state: present

- name: Create deployer user
  user:
    name: "{{ deployer_user }}"
    group: "{{ deployer_user }}"
    groups: "sudo"
    append: true
    shell: "{{ deployer_shell }}"
    state: present

- name: Configure passwordless sudo for deployer
  copy:
    dest: "/etc/sudoers.d/{{ deployer_user }}"
    content: "{{ deployer_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Add authorized SSH key for deployer
  ansible.posix.authorized_key:
    user: "{{ deployer_user }}"
    key: "{{ deployer_ssh_public_key }}"
    state: present
